name: Release

# NX-OP01 (Nexo IA): en el fork solo publican las etiquetas propias
# v<engram>-nexo.<n> (p. ej. v3.4.0-nexo.1), con .goreleaser.nexo.yaml (sin la
# fórmula de Homebrew de Engram). Las etiquetas de Engram que se traigan
# (v3.4.0, ...) ya no disparan nada. La ejecución manual compila sin publicar.
on:
  push:
    tags:
      - "v*-nexo.*" # NX-OP01 (antes "v*")
  workflow_dispatch: # NX-OP01: prueba sin publicar (goreleaser --snapshot)

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.repository == 'Adriel2503/engram-nexo' # NX-OP01
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # NX-OP01: solo se publica lo que ya está en main (la rama estable).
      - name: Check that the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "La etiqueta ${GITHUB_REF_NAME} no está en main; pasa el commit a main antes de etiquetar." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.10"

      - name: Verify module metadata is tidy
        run: go mod tidy -diff

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          # NX-OP01: configuración Nexo; sin etiqueta (ejecución manual) solo compila.
          args: release --clean --config .goreleaser.nexo.yaml ${{ startsWith(github.ref, 'refs/tags/') && ' ' || '--snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
