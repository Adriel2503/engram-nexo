name: Publish Engram Cloud Image

# NX-OP01 (Nexo IA): en el fork publica la imagen del servidor Nexo
# (deploy/nexo/Dockerfile) como ghcr.io/adriel2503/nexo-engram-cloud, solo con
# etiquetas v<engram>-nexo.<n>. La ejecución manual construye sin subir.
on:
  push:
    tags:
      - "v*-nexo.*" # NX-OP01 (antes "v*")
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    if: github.repository == 'Adriel2503/engram-nexo' # NX-OP01
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect default-branch release tag
        id: refcheck
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "is_default_branch_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git branch -r --contains "${GITHUB_SHA}" | grep -q "origin/main"; then
            echo "is_default_branch_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_default_branch_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/adriel2503/nexo-engram-cloud # NX-OP01
          # NX-OP01: latest solo si la etiqueta está en main; versión exacta
          # (3.4.0-nexo.1); sha- en la ejecución manual (que no sube nada).
          tags: |
            type=raw,value=latest,enable=${{ steps.refcheck.outputs.is_default_branch_tag == 'true' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Nexo IA cloud
            org.opencontainers.image.description=Servidor Nexo IA (fork engram-nexo): memoria compartida y espacios de conocimiento.
            org.opencontainers.image.source=https://github.com/Adriel2503/engram-nexo
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/nexo/Dockerfile # NX-OP01
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }} # NX-OP01: la ejecución manual solo construye
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
